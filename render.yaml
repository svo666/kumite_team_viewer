services:
  - type: web
    name: kumite-team-viewer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 20 --timeout 300 --keep-alive 75 --access-logfile - --access-logformat '%(h)s %(m)s %(U)s %(H)s %(s)s %(D)s' --error-logfile -
    envVars:
      - key: DEFAULT_SOURCE_URL
        value: https://www.k2.main1.hu/index.php?p=competitionschedule&compid=512&slsession=61d96bcdda
      - key: SERVER_POLL_SECONDS
        value: 45
      - key: CACHE_TTL_SECONDS
        value: 45
      - key: BROWSER_TIMEOUT_SECONDS
        value: 10
